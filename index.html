<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Confirmação de Idade</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #000, #1a1a1a);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
    }
    .box {
      background: #111;
      padding: 45px 30px;
      border-radius: 22px;
      max-width: 460px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    }
    h1 {
      color: #ff4d4d;
      margin-bottom: 10px;
    }
    p {
      color: #ccc;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 15px;
      font-size: 1rem;
    }
    .ok {
      background: #25d366;
      color: #000;
    }
    .sair {
      background: #333;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>🔞 Conteúdo Adulto</h1>
    <p>
      Este site é destinado apenas a maiores de 18 anos.
      Ao continuar, você confirma que possui idade legal.
    </p>

    <button class="ok" onclick="entrar()">Sou maior de 18 anos</button>
    <button class="sair" onclick="sair()">Sair</button>
  </div>

  <script>
    function entrar() {
      window.location.href = "site.html";
    }
    function sair() {
      alert("Acesso permitido apenas para maiores de 18 anos.");
      window.location.href = "https://www.google.com";
    }
  </script>
</body>
</html>
